<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" fill="none">
  <!-- BUFFALO Geometric Isotype -->
  <g id="buffalo-origami">
    <!-- Back & Spine Facets -->
    <polygon points="40,260 140,260 250,150 210,150" fill="currentColor" opacity="0.95"/>
    <polygon points="210,150 250,150 430,30 330,170" fill="currentColor" opacity="0.8"/>
    <polygon points="430,30 470,120 440,150 380,130" fill="currentColor" opacity="0.9"/>
    
    <!-- Body & Flank Facets -->
    <polygon points="140,260 250,150 330,170 270,260" fill="currentColor" opacity="0.88"/>
    <polygon points="330,170 430,30 410,210 330,170" fill="currentColor" opacity="0.75"/>
    <polygon points="270,260 330,170 410,210 370,260" fill="currentColor" opacity="0.65"/>
    
    <!-- Head & Chin Facets -->
    <polygon points="430,30 470,120 440,190 395,175" fill="currentColor" opacity="0.95"/>
    <polygon points="470,120 480,140 450,220 405,220 440,190" fill="currentColor" opacity="0.7"/>
    <polygon points="450,220 430,260 395,220 405,220" fill="currentColor" opacity="1"/>
    
    <!-- Horn Accent -->
    <path d="M425,140 C440,110 455,90 460,85 C450,110 440,135 430,155 Z" fill="#DFB6B2"/>
    
    <!-- Underbelly Cutout facet -->
    <polygon points="150,260 210,150 270,260" fill="currentColor" opacity="0.4"/>
  </g>
</svg>
